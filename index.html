<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: 3D Квест от 3-го лица</title>
    <!-- Подключаем библиотеку Three.js через супернадежный CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; font-family: Arial, sans-serif; }
        
        /* Свиток с историческим заданием */
        #quest-ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 550px; background: rgba(255, 248, 235, 0.95); color: #2b1a0e; 
            padding: 25px; border-radius: 12px; border: 3px double #5c3a21; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); text-align: center; display: none; z-index: 100;
        }
        .ans-btn {
            background-color: #8c6239; color: white; border: none; padding: 12px 20px;
            margin: 6px; cursor: pointer; font-size: 15px; border-radius: 6px; font-weight: bold;
        }
        .ans-btn:hover { background-color: #5c3a21; }
        
        /* Панель подсказок */
        #top-bar {
            position: absolute; top: 15px; left: 15px; background: rgba(44, 29, 17, 0.85);
            color: #fff; padding: 12px 18px; border-radius: 6px; font-size: 14px; 
            pointer-events: none; border: 1px solid #8c6239; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <strong>📜 3D-Город Науки (Вид от 3-го лица)</strong><br>
        • Управление: <strong>W, A, S, D</strong> или <strong>Стрелочки</strong><br>
        • Задача: Дойди персонажем до цветных неоновых лучей!
    </div>

    <div id="quest-ui">
        <h2 id="q-title" style="color: #5c3a21; margin-top: 0;">Станция</h2>
        <p id="q-text" style="line-height: 1.5; text-align: justify;"></p>
        <p><strong id="q-question">Вопрос...</strong></p>
        <div id="q-answers"></div>
        <br>
        <button class="ans-btn" style="background-color: #b71c1c;" onclick="closeQuest()">Закрыть ❌</button>
    </div>

    <script>
        // --- Настройка 3D Сцены ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb5c6e0); // Цвет неба
        scene.fog = new THREE.FogExp2(0xb5c6e0, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffebd2, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Земля (Брусчатка площади) ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x7d7367, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- Создание Персонажа (3D Житель от 3-го лица) ---
        const playerGroup = new THREE.Group();
        
        // Тело (камзол)
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.6, 1.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0288d1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerGroup.add(body);

        // Голова
        const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc80 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.6;
        head.castShadow = true;
        playerGroup.add(head);

        // Треуголка (Шляпа 18 века)
        const hatGeo = new THREE.ConeGeometry(0.5, 0.3, 3);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0x212121 });
        const hat = new THREE.Mesh(hatGeo, hatMat);
        hat.position.y = 1.85;
        hat.rotation.y = Math.PI / 2;
        playerGroup.add(hat);

        playerGroup.position.set(0, 0, 15);
        scene.add(playerGroup);

        // Параметры движения персонажа
        const playerProps = { speed: 0.15, rotationSpeed: 0.05, radius: 0.6 };
        const keys = {};

        // --- Архитектура Города (3D Дома) ---
        function createHouse(x, z, w, h, d, wallColor, roofColor) {
            const house = new THREE.Group();
            // Стены
            const wallGeo = new THREE.BoxGeometry(w, h, d);
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.y = h / 2;
            walls.castShadow = true;
            walls.receiveShadow = true;
            house.add(walls);
            // Крыша
            const roofGeo = new THREE.ConeGeometry(w * 0.75, 4, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = h + 2;
            roof.rotation.y = Math.PI / 4;
            house.add(roof);

            house.position.set(x, 0, z);
            scene.add(house);
        }

        // Строим улочки вокруг площади
        createHouse(-18, -20, 10, 10, 10, 0xa1887f, 0x5d4037);
        createHouse(18, -20, 10, 12, 10, 0xbcaaa4, 0x4e342e);
        createHouse(-22, 5, 12, 9, 8, 0x8d6e63, 0x212121);
        createHouse(22, 5, 12, 9, 8, 0xd7ccc8, 0x3e2723);

        // Центральный монумент площади
        const monBaseGeo = new THREE.CylinderGeometry(2, 2.2, 0.6, 12);
        const monBaseMat = new THREE.MeshStandardMaterial({ color: 0x616161 });
        const monBase = new THREE.Mesh(monBaseGeo, monBaseMat);
        monBase.position.set(0, 0.3, 0);
        scene.add(monBase);

        const pillarGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 8);
        const pillar = new THREE.Mesh(pillarGeo, monBaseMat);
        pillar.position.set(0, 2.3, 0);
        pillar.castShadow = true;
        scene.add(pillar);

        // --- НАУЧНЫЕ СТАНЦИИ (3D Лучи и Кристаллы) ---
        const stations = [
            { id: 1, x: -9, z: -6, color: 0x4caf50, crystal: null, title: '🏛️ Станция Исаака Ньютона', info: 'В начале 18 века Ньютон совершил революцию в оптике, объяснив устройство радуги и разложив белый свет через призму.', question: 'Как называется распад света на цвета спектра?', answers: ['Дисперсия', 'Дифракция', 'Интерференция'], correct: 0 },
            { id: 2, x: 9, z: -6, color: 0x2196f3, crystal: null, title: '⚡ Станция Б. Franzlina', info: 'В 1752 году Франклин поймал молнию воздушным змеем и доказал, что это электричество.', question: 'Какое защитное устройство он изобрел после этого?', answers: ['Громоотвод', 'Изолятор', 'Резистор'], correct: 0 },
            { id: 3, x: -9, z: 6, color: 0xff9800, crystal: null, title: '🎈 Станция братьев Монгольфье', info: 'В 1783 году во Франции их воздушный шар впервые поднял человека в воздух.', question: 'Каким газом они наполняли шар?', answers: ['Гелием', 'Горячим дымом/воздухом', 'Водородом'], correct: 1 },
            { id: 4, x: 9, z: 6, color: 0xe91e63, crystal: null, title: '🧪 Станция А. Лавуазье', info: 'Лавуазье создал современную химию, доказав, что для горения необходим кислород.', question: 'Какую старую ложную теорию горения он опроверг?', answers: ['Теорию флогистона', 'Теорию алхимии', 'Теорию эфира'], correct: 0 }
        ];

        stations.forEach(s => {
            // Вертикальный светящийся луч неонового цвета
            const beamGeo = new THREE.CylinderGeometry(0.8, 0.8, 12, 16, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(s.x, 6, s.z);
            scene.add(beam);

            // Парящий кристалл над лучом
            const cryGeo = new THREE.OctahedronGeometry(0.4, 0);
            const cryMat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.2, metalness: 0.5 });
            const crystal = new THREE.Mesh(cryGeo, cryMat);
            crystal.position.set(s.x, 2.5, s.z);
            scene.add(crystal);
            s.crystal = crystal; // сохраняем ссылку для анимации
        });

        // --- Управление Клавиатурой ---
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const ui = document.getElementById('quest-ui');

        function updateGame() {
            if (ui.style.display === 'block') return;

            // Ходьба Вперед / Назад
            if (keys['w'] || keys['arrowup']) {
                playerGroup.translateZ(-playerProps.speed);
            }
            if (keys['s'] || keys['arrowdown']) {
                playerGroup.translateZ(playerProps.speed);
            }
            // Повороты Влево / Вправо
            if (keys['a'] || keys['arrowleft']) {
                playerGroup.rotation.y += playerProps.rotationSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                playerGroup.rotation.y -= playerProps.rotationSpeed;
            }

            // Барьеры карты (чтобы игрок не убегал в пустоту)
            if (playerGroup.position.x < -35) playerGroup.position.x = -35;
            if (playerGroup.position.x > 35) playerGroup.position.x = 35;
