<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: 3D Квест от 3-го лица</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #2c1d11; font-family: Arial, sans-serif; }
        
        /* Игровой экран */
        #game-view {
            position: relative; width: 100vw; height: 100vh;
            background-color: #cca474; /* Цвет брусчатки площади */
            overflow: hidden;
            perspective: 600px; /* Эффект 3D перспективы в браузере! */
        }

        /* Виртуальный 3D-мир (карта, которая двигается вокруг игрока) */
        #world {
            position: absolute; width: 2000px; height: 2000px;
            left: 50%; top: 50%;
            transform-style: preserve-3d;
            transform: rotateX(55deg) translate3d(-1000px, -1000px, 0); /* Наклон от 3-го лица */
            transition: transform 0.1s linear;
        }

        /* Сетка площади */
        #grid {
            position: absolute; width: 100%; height: 100%;
            background-image: linear-gradient(#bfa280 2px, transparent 2px), linear-gradient(90deg, #bfa280 2px, transparent 2px);
            background-size: 60px 60px;
        }

        /* Трёхмерное здание (3D House) */
        .house {
            position: absolute; width: 120px; height: 120px;
            transform-style: preserve-3d;
        }
        .wall {
            position: absolute; width: 100%; height: 130px;
            background-color: #8d6e63; border: 3px solid #3e2723;
            box-sizing: border-box; transform-origin: bottom;
        }
        /* Разворачиваем стены в 3D куб */
        .front  { transform: rotateX(-90deg) translateZ(0px); background-color: #a1887f; }
        .back   { transform: rotateX(-90deg) translateZ(-120px); background-color: #5d4037; }
        .left   { transform: rotateY(-90deg) rotateX(-90deg) translateZ(0px); width: 120px; background-color: #8d6e63; }
        .right  { transform: rotateY(90deg) rotateX(-90deg) translateZ(-120px); width: 120px; background-color: #4e342e; }
        .roof   { 
            position: absolute; width: 120px; height: 120px; 
            background: #4caf50; border: 3px solid #1b5e20;
            transform: translateZ(130px); 
        }

        /* Научный луч (Станция) */
        .neon-beam {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            transform-style: preserve-3d;
        }
        .laser {
            position: absolute; width: 8px; height: 350px; left: 16px; bottom: 0;
            transform: rotateX(-90deg); transform-origin: bottom;
            box-shadow: 0 0 20px currentcolor;
        }

        /* Персонаж от 3-го лица (стоит мертво в центре экрана) */
        #player {
            position: absolute; width: 30px; height: 60px;
            left: 50%; top: 50%; margin-left: -15px; margin-top: -45px;
            z-index: 50; pointer-events: none;
        }
        .hero-body { width: 30px; height: 45px; background: #0288d1; border: 2px solid #01579b; border-radius: 4px; }
        .hero-head { width: 18px; height: 18px; background: #ffcc80; border-radius: 50%; border: 2px solid #000; margin: -55px auto 0 auto; }
        .hero-hat { width: 34px; height: 10px; background: #212121; margin: -67px auto 0 -2px; border-radius: 3px; }

        /* Интерфейс (Свиток задания) */
        #quest-ui {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 530px; background: rgba(255, 248, 235, 0.98); color: #2b1a0e; 
            padding: 22px; border-radius: 12px; border: 3px double #5c3a21; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); text-align: center; display: none; z-index: 1000;
        }
        .ans-btn {
            background-color: #8c6239; color: white; border: none; padding: 12px 18px;
            margin: 5px; cursor: pointer; font-size: 15px; border-radius: 6px; font-weight: bold;
        }
        .ans-btn:hover { background-color: #5c3a21; }
        
        #top-bar {
            position: absolute; top: 15px; left: 15px; background: rgba(44, 29, 17, 0.85);
            color: #fff; padding: 12px 18px; border-radius: 6px; font-size: 14px; 
            pointer-events: none; border: 1px solid #8c6239; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="top-bar">
            <strong>📜 3D-Город Науки (Вид от 3-го лица)</strong><br>
            • Управление: <strong>W, A, S, D</strong> или <strong>Стрелочки</strong><br>
            • Задача: Дойди персонажем до светящихся неоновых лучей!
        </div>

        <!-- 3D Мир, который двигается вокруг стоящего в центре игрока -->
        <div id="world">
            <div id="grid"></div>
            
            <!-- 4 объёмных исторических здания со станциями -->
            <!-- Ньютон -->
            <div class="house" style="left: 700px; top: 700px;">
                <div class="wall front"></div><div class="wall back"></div>

                <div class="roof" style="background: #4caf50;"></div>

            </div>
            <div class="neon-beam" style="left: 740px; top: 850px; color: #4caf50;"><div class="laser" style="background: #4caf50;"></div></div>

            <div class="house" style="left: 1200px; top: 700px;">

                <div class="wall left"></div><div class="wall right"></div>
                <div class="roof" style="background: #2196f3;"></div>
                <div style="position:absolute; color:#fff; font-weight:bold; transform:translateZ(170px); width:150px; text-align:center; left:-15px;">Франклин</div>
            </div>
            <div class="neon-beam" style="left: 1240px; top: 850px; color: #2196f3;"><div class="laser" style="background: #2196f3;"></div></div>

            <!-- Монгольфье -->
            <div class="house" style="left: 700px; top: 1200px;">
                <div class="wall front"></div><div class="wall back"></div>

                <div class="roof" style="background: #ff9800;"></div>
                <div style="position:absolute; color:#fff; font-weight:bold; transform:translateZ(170px); width:150px; text-align:center; left:-15px;">Монгольфье</div>
            </div>
            <div class="neon-beam" style="left: 740px; top: 1350px; color: #ff9800;"><div class="laser" style="background: #ff9800;"></div></div>

            <!-- Лавуазье -->
            <div class="house" style="left: 1200px; top: 1200px;">
                <div class="wall front"></div><div class="wall back"></div>
                <div class="wall left"></div><div class="wall right"></div>
                <div class="roof" style="background: #e91e63;"></div>
                <div style="position:absolute; color:#fff; font-weight:bold; transform:translateZ(170px); width:150px; text-align:center; left:-15px;">Лавуазье</div>
            </div>
            <div class="neon-beam" style="left: 1240px; top: 1350px; color: #e91e63;"><div class="laser" style="background: #e91e63;"></div></div>
        </div>

        <!-- Житель города (Игрок) строго по центру -->
        <div id="player">
            <div class="hero-body"></div>
            <div class="hero-head"></div>
            <div class="hero-hat"></div>
        </div>

        <!-- Квест -->
        <div id="quest-ui">
            <h2 id="q-title" style="color: #5c3a21; margin-top: 0;">Станция</h2>
            <p id="q-text" style="line-height: 1.5; text-align: justify;"></p>
            <p><strong id="q-question">Вопрос...</strong></p>
            <div id="q-answers"></div>
            <br>
            <button class="ans-btn" style="background-color: #b71c1c;" onclick="closeQuest()">Закрыть ❌</button>
        </div>
    </div>

    <script>
        const world = document.getElementById('world');
        const ui = document.getElementById('quest-ui');

        // Позиция игрока на виртуальной карте (центр = 1000, 1000)
        let pX = 1000;
        let pY = 1000;
        const speed = 7;
        const keys = {};

        const stations = [
            { x: 740, y: 850, title: '🏛️ Станция Исаака Ньютона', info: 'В начале 18 века Ньютон совершил революцию в оптике, объяснив устройство радуги и разложив белый свет через призму.', question: 'Как называется распад света на цвета спектра?', answers: ['Дисперсия', 'Дифракция', 'Интерференция'], correct: 0 },
            { x: 1240, y: 850, title: '⚡ Станция Б. Франклина', info: 'В 1752 году Франклин поймал молнию воздушным змеем и доказал, что это электричество.', question: 'Какое защитное устройство он изобрел после этого?', answers: ['Громоотвод', 'Изолятор', 'Резистор'], correct: 0 },
            { x: 740, y: 1350, title: '🎈 Станция братьев Монгольфье', info: 'В 1783 году во Франции их воздушный шар впервые поднял человека в воздух.', question: 'Каким газом они наполняли шар?', answers: ['Гелием', 'Горячим дымом/воздухом', 'Водородом'], correct: 1 },
            { x: 1240, y: 1350, title: '🧪 Станция А. Лавуазье', info: 'Лавуазье создал современную химию, доказав, что для горения необходим кислород.', question: 'Какую старую ложную теорию горения он опроверг?', answers: ['Теорию флогистона', 'Теорию алхимии', 'Теорию эфира'], correct: 0 }
        ];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function gameLoop() {
