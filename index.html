<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: Высококачественный 3D Музей</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #060403; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; }
        
        #game-view-wrapper { position: relative; width: 800px; height: 600px; box-shadow: 0 0 80px rgba(0,0,0,0.95); border: 5px solid #3d2514; border-radius: 10px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background-color: #060810; }
        
        #ui-parchment { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 520px; background: #f7f1da; color: #26170c; padding: 30px; border-radius: 6px; border: 12px double #4a321a; box-shadow: 0 30px 80px rgba(0,0,0,0.95); text-align: center; display: none; z-index: 500; background-image: radial-gradient(circle, #faf6eb 50%, #e3ce9c 100%); }
        .scroll-title { font-size: 21px; font-weight: bold; color: #4a2f13; margin-bottom: 14px; border-bottom: 3px double #8d6e63; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .scroll-text { font-size: 14px; line-height: 1.6; text-align: justify; margin-bottom: 15px; color: #3e2723; font-style: italic; }
        
        .station-badge { display: inline-block; background: #5c3a21; color: #f7f1da; padding: 5px 12px; font-size: 11px; border-radius: 4px; text-transform: uppercase; margin-bottom: 12px; font-weight: bold; }
        .close-btn { background: #4a321a; color: white; border: 1px solid #26170c; padding: 10px 24px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        
        #controls-hint { position: absolute; bottom: 15px; left: 15px; color: #fcf8f2; font-size: 12px; background: rgba(12, 8, 5, 0.85); padding: 10px 16px; border-radius: 5px; pointer-events: none; border: 1px solid #5c3a21; line-height: 1.5; }
    </style>
</head>
<body>

<div id="game-view-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-parchment">
        <div class="station-badge" id="station-label">Научная станция</div>
        <div class="scroll-title" id="station-title">Название открытия</div>
        <p class="scroll-text" id="station-text">Описание...</p>
        <button class="close-btn" onclick="closeStationUI()">Продолжить путь</button>
    </div>

    <div id="controls-hint">
        <strong>Прогулка по Научному Кварталу:</strong><br>
        • Движение: клавиши <b>W / S</b> (или Стрелки Вверх / Вниз)<br>
        • Поворот обзора: клавиши <b>A / D</b> (или Стрелки Влево / Вправо)
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const MAP_WIDTH = 12;
    const MAP_HEIGHT = 12;
    let playerX = 6.5;
    let playerY = 6.5;
    let playerAngle = 0.0; 
    
    const FOV = Math.PI / 3; 
    const HALF_FOV = FOV / 2;
    const NUM_RAYS = 400; 
    const STEP_ANGLE = FOV / NUM_RAYS;
    const MAX_DEPTH = 16.0;

    const gameMap = [];
    const keys = { Left: false, Right: false, Forward: false, Backward: false };
    let activeStation = null;

    // Резервируем буферы под текстуры высокого разрешения (128x128 пикселей)
    const TEX_SIZE = 128;
    const textures = {
        1: new Array(TEX_SIZE * TEX_SIZE), // Обычный дом
        2: new Array(TEX_SIZE * TEX_SIZE), // Каменная башня
        3: new Array(TEX_SIZE * TEX_SIZE), // Синий особняк
        4: new Array(TEX_SIZE * TEX_SIZE), // Зелёный особняк
        5: new Array(TEX_SIZE * TEX_SIZE), // Оранжевый особняк
        6: new Array(TEX_SIZE * TEX_SIZE)  // Пурпурный особняк
    };

    // Безопасное подмешивание шума старины без поломок
    function blendNoise(hex, noise) {
        let r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3), 16) + noise));
        let g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5), 16) + noise));
        let b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7), 16) + noise));
        return `rgb(${r},${g},${b})`;
    }

    // Процедурный генератор текстур без пропусков строк
    function generateUltraTextures() {
        for (let y = 0; y < TEX_SIZE; y++) {
            for (let x = 0; x < TEX_SIZE; x++) {
                let idx = y * TEX_SIZE + x;
                let noise = Math.floor(Math.random() * 14) - 7;

                // 1. Обычный кирпичный дом (Терракотовый)
                if (y % 8 === 0 || (x % 16 === 0 && Math.floor(y / 8) % 2 === 0)) {
                    textures[1][idx] = '#401e16'; 
                } else if ((y >= 8 && y <= 12) || (y >= 60 && y <= 64)) {
                    textures[1][idx] = blendNoise('#d9ceb6', noise); 
                } else {
                    let isWin = false;
                    for (let r = 0; r < 3; r++) {
                        let t = 20 + r * 38;
                        if (y >= t && y < t + 24 && ((x >= 24 && x < 54) || (x >= 74 && x < 104))) {
                            isWin = true;
                            let eX = x >= 24 && x < 54 ? 24 : 74;
                            textures[1][idx] = (x === eX || x === eX+29 || y === t || y === t+23 || x === eX+15 || y === t+12) ? '#2b1a0d' : '#fae19c';
                        }
                    }
                    if (!isWin) textures[1][idx] = blendNoise('#ab4e3c', noise);
                }

                // 2. Старая каменная башня
                textures[2][idx] = (y % 32 === 0 || x % 32 === 0) ? '#2b2a27' : blendNoise('#736f66', noise * 2);

                // Генератор фасадов для научных особняков-станций
                function makeStation(bCol, tCol, wCol, tId) {
                    if (y > 105 || x < 12 || x > 116 || (y >= 14 && y <= 20) || (y >= 62 && y <= 68)) {
                        textures[tId][idx] = blendNoise(tCol, noise);
                    } else {
                        let isW = false;
                        for (let r = 0; r < 2; r++) {
                            let t = 26 + r * 44;
                            for (let c = 0; c < 2; c++) {
                                let l = 28 + c * 46;
                                if (x >= l && x < l + 26 && y >= t && y < t + 28) {
                                    isW = true;
                                    textures[tId][idx] = (x === l || x === l + 25 || y === t || y === t + 27 || x === l + 13 || y === t + 12) ? '#1f1a14' : wCol;
                                }
                            }
                        }
                        if (!isW) textures[tId][idx] = blendNoise(bCol, noise);
                    }
                }
                makeStation('#2b547e', '#e5d3b3', '#fff0b3', 3); // Станция 1: Синий
                makeStation('#4a7c59', '#f5f5f5', '#fae8b4', 4); // Станция 2: Зеленый
                makeStation('#cf7a42', '#6b6b6b', '#fff2cc', 5); // Станция 3: Оранжевый
                makeStation('#663344', '#fdf6e2', '#fceaa4', 6); // Станция 4: Пурпурный
            }
        }
    }
    generateUltraTextures();
    // --- ВЫСОКОКАЧЕСТВЕННЫЙ 3D РЕНДЕРЕР (RAYCASTING + SHADING) ---
    function render3D() {
        // Отрендерить вечерний небосвод
        let skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
        skyGrad.addColorStop(0, '#04060f');
        skyGrad.addColorStop(0.5, '#121829');
        skyGrad.addColorStop(1, '#2d1f2d');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, 800, 300);

        // Отрендерить каменную брусчатку дороги
        let floorGrad = ctx.createLinearGradient(0, 300, 0, 600);
        floorGrad.addColorStop(0, '#0f0e0d');
        floorGrad.addColorStop(1, '#030302');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, 300, 800, 300);

        // Горизонтальные стыки каменных плит
        ctx.fillStyle = 'rgba(15, 12, 10, 0.5)';
        for (let y = 305; y < 600; y += 12) {
            ctx.fillRect(0, y, 800, 1);
        }

        let startAngle = playerAngle - HALF_FOV;

        // Построение 400 вертикальных линий экрана
        for (let i = 0; i < NUM_RAYS; i++) {
            let rayAngle = startAngle + i * STEP_ANGLE;
            let sin = Math.sin(rayAngle);
            let cos = Math.cos(rayAngle);

            let distanceToWall = 0;
            let hitWall = false;
            let wallType = 0;
            let textureX = 0;

            while (!hitWall && distanceToWall < MAX_DEPTH) {
                distanceToWall += 0.012; 
                let checkX = Math.floor(playerX + cos * distanceToWall);
                let checkY = Math.floor(playerY + sin * distanceToWall);

                if (checkX < 0 || checkX >= MAP_WIDTH || checkY < 0 || checkY >= MAP_HEIGHT) {
                    hitWall = true;
                    distanceToWall = MAX_DEPTH;
                } else {
                    let tile = gameMap[checkY][checkX];
                    if (tile > 0) {
                        hitWall = true;
                        wallType = tile;

                        let hitX = playerX + cos * distanceToWall;
                        let hitY = playerY + sin * distanceToWall;
                        let blockX = hitX - Math.floor(hitX);
                        let blockY = hitY - Math.floor(hitY);
                        
                        if (Math.abs(blockY) < 0.015 || Math.abs(blockY - 1) < 0.015) {
                            textureX = Math.floor(blockX * TEX_SIZE);
                        } else {
                            textureX = Math.floor(blockY * TEX_SIZE);
                        }
                        textureX = Math.max(0, Math.min(TEX_SIZE - 1, textureX));
                    }
                }
            }

            let correctedDistance = distanceToWall * Math.cos(rayAngle - playerAngle);
            let wallHeight = Math.min(600, Math.floor(450 / correctedDistance));
            let screenX = i * 2; 
            let wallTop = Math.floor((600 - wallHeight) / 2);
            let wallBottom = wallTop + wallHeight;

            if (distanceToWall < MAX_DEPTH) {
                let shade = Math.max(0.12, 1 - (distanceToWall / MAX_DEPTH));
                const texArray = textures[wallType];
                
                // Рендеринг вертикальной текстурной полосы стены
                for (let screenY = wallTop; screenY < wallBottom; screenY++) {
                    let textureY = Math.floor(((screenY - wallTop) / wallHeight) * TEX_SIZE);
                    textureY = Math.max(0, Math.min(TEX_SIZE - 1, textureY));

                    ctx.fillStyle = texArray[textureY * TEX_SIZE + textureX];
                    ctx.fillRect(screenX, screenY, 2, 1);
                }

                // Скатная черепичная крыша особняка
                let roofHeight = wallHeight * 0.4;
                ctx.fillStyle = `rgb(${120 * shade}, ${38 * shade}, ${28 * shade})`;
                ctx.beginPath();
                ctx.moveTo(screenX, wallTop);
                ctx.lineTo(screenX + 2, wallTop);
                ctx.lineTo(screenX + 1, wallTop - roofHeight);
                ctx.fill();

                // Горизонтальные рельефные линии черепицы
                if (wallHeight > 40) {
                    ctx.fillStyle = `rgba(30, 10, 5, ${0.3 * shade})`;
                    for (let ry = wallTop - 2; ry > wallTop - roofHeight; ry -= Math.max(2, wallHeight / 30)) {
                        ctx.fillRect(screenX, Math.floor(ry), 2, 1);
                    }
                }

                // Шейдер глубины и рассеянного затенения (мягкий туман)
                if (distanceToWall > 1.0) {
                    let shadowAlpha = Math.min(0.88, (distanceToWall / MAX_DEPTH));
                    ctx.fillStyle = `rgba(6, 8, 16, ${shadowAlpha})`;
                    ctx.fillRect(screenX, wallTop, 2, wallHeight);
                }
            }
        }
    }
    // --- АВТОМАТИЧЕСКИЕ ТРИГГЕРЫ СТАНЦИЙ ПРИ ПРИБЛИЖЕНИИ ---
    function checkStationProximity() {
        let currentBlockX = Math.floor(playerX);
        let currentBlockY = Math.floor(playerY);
        let foundStation = null;

        const checkOffsets = [
            {x: 0, y: 1}, {x: 0, y: -1}, {x: 1, y: 0}, {x: -1, y: 0},
            {x: 1, y: 1}, {x: -1, y: -1}, {x: 1, y: -1}, {x: -1, y: 1}
        ];

        for (let offset of checkOffsets) {
            let targetX = currentBlockX + offset.x;
            let targetY = currentBlockY + offset.y;
            
            if (targetX >= 0 && targetX < MAP_WIDTH && targetY >= 0 && targetY < MAP_HEIGHT) {
                let tile = gameMap[targetY][targetX];
                if (tile >= 3 && tile <= 6) { 
                    foundStation = tile;
                    break;
                }
            }
        }

        if (foundStation && activeStation !== foundStation) {
            activeStation = foundStation;
            const info = stationsInfo[foundStation];
            document.getElementById('station-label').innerText = info.label;
            document.getElementById('station-title').innerText = info.title;
            document.getElementById('station-text').innerText = info.text;
            document.getElementById('ui-parchment').style.display = 'block';
        } else if (!foundStation && activeStation !== null) {
            closeStationUI();
        }
    }

    function closeStationUI() {
        document.getElementById('ui-parchment').style.display = 'none';
        activeStation = null;
    }

    // --- ОБРАБОТКА НАЖАТИЙ КЛАВИШ ---
    window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.Left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.Right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.Forward = true;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.Backward = true;
    });

    window.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.Left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.Right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.Forward = false;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.Backward = false;
    });

    // --- НАДЁЖНАЯ ФИЗИКА ДВИЖЕНИЯ И СКОЛЬЖЕНИЯ ВДОЛЬ СТЕН ---
    function movePlayer() {
        let moveSpeed = 0.045;
        let rotateSpeed = 0.038;

        if (keys.Left) {
            playerAngle -= rotateSpeed;
            if (playerAngle < 0) playerAngle += Math.PI * 2;
        }
        if (keys.Right) {
            playerAngle += rotateSpeed;
            if (playerAngle > Math.PI * 2) playerAngle -= Math.PI * 2;
        }

        let newX = playerX;
        let newY = playerY;

        if (keys.Forward) {
            newX += Math.cos(playerAngle) * moveSpeed;
            newY += Math.sin(playerAngle) * moveSpeed;
        }
        if (keys.Backward) {
            newX -= Math.cos(playerAngle) * moveSpeed;
            newY -= Math.sin(playerAngle) * moveSpeed;
        }

        // Раздельный расчёт осей полностью исключает застревания и проваливания сквозь особняки
        if (gameMap[Math.floor(playerY)][Math.floor(newX)] === 0) playerX = newX;
        if (gameMap[Math.floor(newY)][Math.floor(playerX)] === 0) playerY = newY;
    }

    // --- ГЛАВНЫЙ ЦИКЛ ОБНОВЛЕНИЯ ДВИЖКА ---
    function updateGame() {
        movePlayer();
        checkStationProximity();
        render3D();
        requestAnimationFrame(updateGame);
    }

    updateGame();
</script>
</body>
</html>
