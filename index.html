<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: Город Науки</title>
    <!-- Подключаем библиотеку A-Frame для 3D графики прямо в HTML -->
    <script src="https://aframe.io"></script>
    <style>
        /* Стили для интерфейса поверх 3D-сцены */
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(44, 34, 24, 0.9);
            color: #f5ebe0;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid #8d6e63;
            font-family: sans-serif;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none; /* Изначально скрыто */
            z-index: 10;
        }
        .ui-btn {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px 0 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .ui-btn:hover { background-color: #a1887f; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: sans-serif;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Инструкция для игрока -->
    <div id="instructions">
        <strong>Управление:</strong><br>
        • Ходить: WASD или Стрелочки<br>
        • Осмотреться: Мышка<br>

            });
