<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: 3D Квест от 3-го лица</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; font-family: Arial, sans-serif; }
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; background-color: #b5c6e0; }
        
        /* Свиток с заданием */
        #quest-ui {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 550px; background: rgba(255, 248, 235, 0.95); color: #2b1a0e; 
            padding: 25px; border-radius: 12px; border: 3px double #5c3a21; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); text-align: center; display: none; z-index: 100;
        }
        .ans-btn {
            background-color: #8c6239; color: white; border: none; padding: 12px 20px;
            margin: 6px; cursor: pointer; font-size: 15px; border-radius: 6px; font-weight: bold;
        }
        .ans-btn:hover { background-color: #5c3a21; }
        
        /* Панель подсказок */
        #top-bar {
            position: absolute; top: 15px; left: 15px; background: rgba(44, 29, 17, 0.85);
            color: #fff; padding: 12px 18px; border-radius: 6px; font-size: 14px; 
            pointer-events: none; border: 1px solid #8c6239; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="top-bar">
            <strong>📜 3D-Город Науки (Вид от 3-го лица)</strong><br>
            • Управление: <strong>W, A, S, D</strong> или <strong>Стрелочки</strong><br>
            • Задача: Дойди персонажем до цветных неоновых лучей!
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="quest-ui">
            <h2 id="q-title" style="color: #5c3a21; margin-top: 0;">Станция</h2>
            <p id="q-text" style="line-height: 1.5; text-align: justify;"></p>
            <p><strong id="q-question">Вопрос...</strong></p>
            <div id="q-answers"></div>
            <br>
            <button class="ans-btn" style="background-color: #b71c1c;" onclick="closeQuest()">Закрыть ❌</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('quest-ui');

        // Подгоняем холст под размер экрана
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Мир игры (координаты игрока в виртуальном 3D-мире)
        const player = { x: 0, y: 0, speed: 4, angle: 0 };
        const keys = {};

        // Исторические станции (3D здания на карте)
        const stations = [
            { id: 1, x: -150, y: -150, size: 80, height: 120, color: '#4caf50', label: 'Ньютон (Оптика)', title: '🏛️ Станция Исаака Ньютона', info: 'В начале 18 века Ньютон совершил революцию в оптике, объяснив устройство радуги и разложив белый свет через призму.', question: 'Как называется распад света на цвета спектра?', answers: ['Дисперсия', 'Дифракция', 'Интерференция'], correct: 0 },
            { id: 2, x: 150, y: -150, size: 80, height: 120, color: '#2196f3', label: 'Франклин (Физика)', title: '⚡ Станция Б. Франклина', info: 'В 1752 году Франклин поймал молнию воздушным змеем и доказал, что это электричество.', question: 'Какое защитное устройство он изобрел после этого?', answers: ['Громоотвод', 'Изолятор', 'Резистор'], correct: 0 },
            { id: 3, x: -150, y: 150, size: 80, height: 120, color: '#ff9800', label: 'Монгольфье (Полёты)', title: '🎈 Станция братьев Монгольфье', info: 'В 1783 году во Франции их воздушный шар впервые поднял человека в воздух.', question: 'Каким газом они наполняли шар?', answers: ['Гелием', 'Горячим дымом/воздухом', 'Водородом'], correct: 1 },
            { id: 4, x: 150, y: 150, size: 80, height: 120, color: '#e91e63', label: 'Лавуазье (Химия)', title: '🧪 Станция А. Лавуазье', info: 'Лавуазье создал современную химию, доказав, что для горения необходим кислород.', question: 'Какую старую ложную теорию горения он опроверг?', answers: ['Теорию флогистона', 'Теорию алхимии', 'Теорию эфира'], correct: 0 }
        ];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Перевод 3D координат мира в 2D координаты экрана от 3-го лица
        function toScreen(worldX, worldY, worldZ = 0) {
            // Камера зафиксирована на персонаже, поэтому считаем относительное смещение
            let relX = worldX - player.x;
            let relY = worldY - player.y;

            // Изометрическая 3D проекция от третьего лица
            let screenX = (relX - relY) * Math.cos(Math.PI / 6);
            let screenY = (relX + relY) * Math.sin(Math.PI / 6) - worldZ;

            return {
                x: canvas.width / 2 + screenX,
                y: canvas.height / 2 + screenY + 100 // Смещение камеры чуть выше персонажа
            };
        }

        // Отрисовка полноценного 3D-дома на Canvas
        function draw3DHouse(s) {
            let base = toScreen(s.x, s.y);
            let left = toScreen(s.x + s.size, s.y);
            let right = toScreen(s.x, s.y + s.size);
            let back = toScreen(s.x + s.size, s.y + s.size);

            let baseTop = toScreen(s.x, s.y, s.height);
            let leftTop = toScreen(s.x + s.size, s.y, s.height);
            let rightTop = toScreen(s.x, s.y + s.size, s.height);
            let backTop = toScreen(s.x + s.size, s.y + s.size, s.height);

            // 1. Левая стена здания
            ctx.fillStyle = '#a1887f';
            ctx.beginPath();
            ctx.moveTo(base.x, base.y); ctx.lineTo(left.x, left.y);
            ctx.lineTo(leftTop.x, leftTop.y); ctx.lineTo(baseTop.x, baseTop.y);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // 2. Правая стена здания
            ctx.fillStyle = '#8d6e63';
            ctx.beginPath();
            ctx.moveTo(base.x, base.y); ctx.lineTo(right.x, right.y);
            ctx.lineTo(rightTop.x, rightTop.y); ctx.lineTo(baseTop.x, baseTop.y);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // 3. Объёмная 3D крыша
            let roofApex = toScreen(s.x + s.size / 2, s.y + s.size / 2, s.height + 50);
            ctx.fillStyle = s.color;
            
            ctx.beginPath();
            ctx.moveTo(baseTop.x, baseTop.y); ctx.lineTo(leftTop.x, leftTop.y); ctx.lineTo(roofApex.x, roofApex.y);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(baseTop.x, baseTop.y); ctx.lineTo(rightTop.x, rightTop.y); ctx.lineTo(roofApex.x, roofApex.y);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Светящийся неоновый луч от третьего лица перед входом
            let beamCenter = toScreen(s.x + s.size / 2, s.y + s.size / 2);
            let beamTop = toScreen(s.x + s.size / 2, s.y + s.size / 2, 300);
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 6;
            ctx.globalAlpha = 0.4;
            ctx.beginPath(); ctx.moveTo(beamCenter.x, beamCenter.y); ctx.lineTo(beamTop.x, beamTop.y); ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#000';

            // Название станции в воздухе
            ctx.fillStyle = '#2b1a0e';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(s.label, baseTop.x, baseTop.y - 15);
        }

        function loop() {
            // Движение персонажа в 3D пространстве
            if (ui.style.display !== 'block') {
                if (keys['w'] || keys['arrowup']) { player.y -= player.speed; player.x -= player.speed; }
                if (keys['s'] || keys['arrowdown']) { player.y += player.speed; player.x += player.speed; }
                if (keys['a'] || keys['arrowleft']) { player.x -= player.speed; player.y += player.speed; }
                if (keys['d'] || keys['arrowright']) { player.x += player.speed; player.y -= player.speed; }

                // Ограничение карты
                player.x = Math.max(-300, Math.min(300, player.x));
                player.y = Math.max(-300, Math.min(300, player.y));

                // Проверка столкновения с лучами станций
                stations.forEach(s => {
                    let centerX = s.x + s.size / 2;
                    let centerY = s.y + s.size / 2;
                    let dist = Math.sqrt(Math.pow(player.x - centerX, 2) + Math.pow(player.y - centerY, 2));
                    if (dist < 45) {
                        openQuest(s);
                    }
                });
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка 3D сетки брусчатки площади вокруг игрока
            ctx.strokeStyle = '#a69785';
            for (let x = -400; x <= 400; x += 50) {
                ctx.beginPath();
                let p1 = toScreen(x, -400); let p2 = toScreen(x, 400);
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
            for (let y = -400; y <= 400; y += 50) {
                ctx.beginPath();
                let p1 = toScreen(-400, y); let p2 = toScreen(400, y);
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }

            // Отрисовка декоративного монумента в центре (0, 0)
            let centerGeo = toScreen(0, 0);
            ctx.fillStyle = '#5c5c5c';
            ctx.fillRect(centerGeo.x - 15, centerGeo.y - 15, 30, 30);
