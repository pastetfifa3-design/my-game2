<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: Город Науки 3D</title>
    <!-- Подключаем 3D-движок A-Frame -->
    <script src="https://aframe.io"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; font-family: sans-serif; }
        
        /* Экран загрузки */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c1d11; color: #f5ebe0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f5ebe0; border-top-color: #8d6e63;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Свиток с заданием */
        #ui-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 580px; background: rgba(245, 235, 224, 0.95);
            color: #3e2723; padding: 25px; border-radius: 12px; border: 4px dashed #5d4037;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; display: none; z-index: 1000;
        }
        .ui-btn {
            background-color: #8d6e63; color: white; border: none; padding: 12px 24px;
            margin: 8px 6px 0 6px; cursor: pointer; font-size: 16px; border-radius: 6px;
            font-weight: bold; transition: background 0.2s;
        }
        .ui-btn:hover { background-color: #5d4037; }
        
        /* Инструкция */
        #instructions {
            position: absolute; top: 15px; left: 15px; background: rgba(44, 34, 24, 0.85);
            color: #f5ebe0; padding: 15px; border-radius: 8px; font-size: 14px;
            pointer-events: none; border: 2px solid #8d6e63; z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>📜 Строим европейский город XVIII века...</h2>
        <p>Пожалуйста, подождите несколько секунд</p>
    </div>

    <!-- Инструкция для игрока -->
    <div id="instructions">
        <strong style="font-size: 16px;">🏛️ Научный 3D-Квест</strong><br><br>
        • <strong>Ходить:</strong> WASD или Стрелочки<br>
        • <strong>Осмотреться:</strong> Зажми мышку и крути во все стороны<br>
        • <strong>Цель:</strong> Подойди вплотную к цветным лучам света!
    </div>

    <!-- Интерфейс станций (Свиток) -->
    <div id="ui-container">
        <h2 id="station-title" style="margin-top: 0; color: #5d4037;">Название станции</h2>
        <p id="station-info" style="font-size: 15px; line-height: 1.5; text-align: justify;"></p>
        <hr style="border: 0; border-top: 1px solid #d7ccc8; margin: 15px 0;">
        <p id="station-question" style="font-size: 16px;"><strong>Задание:</strong> Вопрос...</p>
        <div id="answers-options"></div>
        <br>
        <button class="ui-btn" style="background-color: #c62828;" onclick="closeUI()">Закрыть ❌</button>
    </div>

    <!-- 3D ПРОСТРАНСТВО -->
    <a-scene shadow="type: pcfsoft" renderer="antialias: true; colorManagement: true;">
        
        <!-- Атмосферное небо (Закат в Европе) -->
        <a-sky color="#fbc5b0"></a-sky>
        <a-gradient-sky material="shader: gradient; topColor: #1f3c6d; bottomColor: #fbc5b0;"></a-gradient-sky>

        <!-- Освещение города -->
        
        

        <!-- Каменная мостовая (Земля) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="120" height="120" color="#615649" roughness="0.9"></a-plane>

        <!-- Трёхмерный Ученик (Камера глазами игрока) -->
        
            <!-- Красивый круглый прицел в центре экрана -->
            <a-cursor color="#8d6e63" opacity="0.7" radius-initial="0.01"></a-cursor>
        

        <!-- ================= ДЕКОРАЦИИ ГОРОДА (АРХИТЕКТУРА) ================= -->
        
        <!-- Центральный городской фонтан -->
        <a-cylinder position="0 0 0" radius="4" height="0.6" color="#424242"></a-cylinder>
        <a-cylinder position="0 0.3 0" radius="3.8" height="0.1" color="#0091ea" opacity="0.8"></a-cylinder>
        <a-cone position="0 1 0" radius-bottom="0.8" radius-top="0" height="1.5" color="#757575"></a-cone>

        <!-- ДОМ 1 (Слева сзади) -->
        
            <a-box width="14" height="12" depth="12" color="#a1887f" shadow></a-box> <!-- Корпус -->
            <a-cone position="0 8 0" radius-bottom="10" height="5" rotation="0 45 0" color="#795548"></a-cone> <!-- Крыша -->
            <a-box position="0 1 -6.1" width="2" height="3.5" depth="0.2" color="#3e2723"></a-box> <!-- Дверь -->
            <a-box position="-3 3 -6.1" width="2" height="2" depth="0.1" color="#e0f7fa"></a-box> <!-- Окно 1 -->
            <a-box position="3 3 -6.1" width="2" height="2" depth="0.1" color="#e0f7fa"></a-box> <!-- Окно 2 -->
        

        <!-- ДОМ 2 (Справа сзади) -->
        
            <a-box width="12" height="14" depth="12" color="#bcaaa4" shadow></a-box>
            <a-cone position="0 9.5 0" radius-bottom="9" height="5" rotation="0 45 0" color="#5d4037"></a-cone>
            <a-box position="0 1 -6.1" width="2" height="3.5" depth="0.2" color="#263238"></a-box>
            <a-box position="-2.5 4 -6.1" width="2" height="2.5" depth="0.1" color="#e0f7fa"></a-box>
            <a-box position="2.5 4 -6.1" width="2" height="2.5" depth="0.1" color="#e0f7fa"></a-box>
        

        <!-- ДОМ 3 (Боковой левый) -->
        
            <a-box width="16" height="11" depth="10" color="#8d6e63" shadow></a-box>
            <a-cone position="0 7.5 0" radius-bottom="11" height="4" rotation="0 45 0" color="#4e342e"></a-cone>
            <a-box position="0 1 -5.1" width="2.5" height="3.5" depth="0.2" color="#1a0c02"></a-box>
        

        <!-- ДОМ 4 (Боковой правый) -->
        
            <a-box width="16" height="11" depth="10" color="#d7ccc8" shadow></a-box>
            <a-cone position="0 7.5 0" radius-bottom="11" height="4" rotation="0 45 0" color="#5d4037"></a-cone>
            <a-box position="0 1 -5.1" width="2.5" height="3.5" depth="0.2" color="#1a0c02"></a-box>
        

        <!-- Городские оборонительные стены на горизонте -->
        <a-box position="0 6 -45" width="100" height="12" depth="4" color="#4e443a" shadow></a-box>
        <a-box position="-45 6 0" width="4" height="12" depth="100" color="#4e443a" shadow></a-box>
        <a-box position="45 6 0" width="4" height="12" depth="100" color="#4e443a" shadow></a-box>

        <!-- ================= НАУЧНЫЕ СТАНЦИИ (ЛУЧИ СВЕТА) ================= -->

        <!-- Станция 1: Исаак Ньютон -->
        
            <a-cylinder radius="1.2" height="6" color="#4caf50" opacity="0.4" material="transparent: true; shader: flat;"></a-cylinder> <!-- Луч -->
            <!-- Крутящийся куб над станцией -->
            <a-box position="0 2 0" width="0.7" height="0.7" depth="0.7" color="#4caf50" 
                   animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear"></a-box>
        

        <!-- Станция 2: Бенджамин Франклин -->
        
            <a-cylinder radius="1.2" height="6" color="#2196f3" opacity="0.4" material="transparent: true; shader: flat;"></a-cylinder>
            <a-box position="0 2 0" width="0.7" height="0.7" depth="0.7" color="#2196f3" 
                   animation="property: rotation; to: 0 360 360; loop: true; dur: 5000; easing: linear"></a-box>
        

        <!-- Станция 3: Братья Монгольфье -->
        
            <a-cylinder radius="1.2" height="6" color="#ff9800" opacity="0.4" material="transparent: true; shader: flat;"></a-cylinder>
            <a-box position="0 2 0" width="0.7" height="0.7" depth="0.7" color="#ff9800" 
                   animation="property: rotation; to: 360 0 360; loop: true; dur: 5000; easing: linear"></a-box>
        

        <!-- Станция 4: Антуан Лавуазье -->
        
            <a-cylinder radius="1.2" height="6" color="#e91e63" opacity="0.4" material="transparent: true; shader: flat;"></a-cylinder>
            <a-box position="0 2 0" width="0.7" height="0.7" depth="0.7" color="#e91e63" 
                   animation="property: rotation; to: 180 360 180; loop: true; dur: 5000; easing: linear"></a-box>
        

    </a-scene>

    <!-- ИГРОВАЯ ЛОГИКА И ПРОВЕРКА КООРДИНАТ -->
    <script>
        // Исторические данные квестов
        const stations = [
            {
                x: -10, z: -8, radius: 2.8,
                title: "🏛️ Станция 1: Исаак Ньютон",
                info: "В начале XVIII века оптика развивалась благодаря открытиям Исаака Ньютона. Он создал зеркальный телескоп (рефлектор) и детально объяснил природу света, разложив обычный белый луч на цвета радуги с помощью стеклянной призмы.",
                question: "Какое физическое явление продемонстрировал Ньютон, пропустив свет через призму?",
                answers: ["Дифракция", "Дисперсия (распад на спектр)", "Поглощение"],
                correct: 1
            },
            {
