<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Квест: 18 век</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #22140a;
            font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #game-wrapper { position: relative; width: 800px; height: 600px; }
        canvas { background-color: #e0d0b8; display: block; border: 4px solid #5c3a21; border-radius: 4px; }
        #quest-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; background: #fff8eb; color: #2b1a0e; padding: 25px;
            border-radius: 8px; border: 3px solid #5c3a21; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center; display: none; z-index: 10;
        }
        .ans-btn {
            background-color: #8c6239; color: white; border: none; padding: 10px 15px;
            margin: 5px; cursor: pointer; font-size: 15px; border-radius: 4px;
        }
        .ans-btn:hover { background-color: #5c3a21; }
        #top-bar {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            color: #fff; padding: 10px; border-radius: 4px; font-size: 13px; pointer-events: none;
        }
        /* Стили для стартового экрана */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 800px; height: 600px;
            background: rgba(34, 20, 10, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; color: #fff8eb;
            border-radius: 4px;
        }
        .start-btn {
            background-color: #8c6239; color: white; border: 2px solid #fff8eb;
            padding: 15px 40px; font-size: 22px; cursor: pointer; border-radius: 8px;
            margin-top: 20px; font-weight: bold;
        }
        .start-btn:hover { background-color: #5c3a21; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Стартовое меню -->
        <div id="start-screen">
            <h1>📜 НАУЧНЫЙ КВЕСТ: XVIII ВЕК</h1>
            <p>Управляйте персонажем и исследуйте великие открытия Европы!</p>
            <button class="start-btn" onclick="startGame()">ИГРАТЬ 🚀</button>
        </div>

        <div id="top-bar">
            <strong>📜 Европа XVIII века: Наука</strong><br>
            • Ходить: WASD или Стрелочки<br>
            • Задача: Подойди вплотную к любому цветному зданию!
        </div>

        <canvas id="questCanvas" width="800" height="600"></canvas>

        <div id="quest-ui">
            <h2 id="q-title">Станция</h2>
            <p id="q-text">Текст...</p>
            <p><strong id="q-question">Вопрос...</strong></p>
            <div id="q-answers"></div>
            <button class="ans-btn" style="background-color: #b71c1c;" onclick="closeQuest()">Закрыть ❌</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('questCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('quest-ui');

        const player = { x: 400, y: 300, size: 22, speed: 5, color: '#0288d1' };
        const keys = {};

        const places = [
            { x: 100, y: 100, size: 80, color: '#4caf50', label: 'Ньютон', title: '🏛️ Станция Исаака Ньютона', info: 'В начале 18 века Ньютон совершил революцию в оптике, объяснив устройство радуги и разложив белый свет через призму.', question: 'Как называется распад света на цвета спектра?', answers: ['Дисперсия', 'Дифракция', 'Интерференция'], correct: 0 },
            { x: 620, y: 100, size: 80, color: '#2196f3', label: 'Франклин', title: '⚡ Станция Б. Франклина', info: 'В 1752 году Франклин поймал молнию воздушным змеем и доказал, что это электричество.', question: 'Какое защитное устройство он изобрел после этого?', answers: ['Громоотвод', 'Изолятор', 'Резистор'], correct: 0 },
            { x: 100, y: 420, size: 80, color: '#ff9800', label: 'Монгольфье', title: '🎈 Станция братьев Монгольфье', info: 'В 1783 году во Франции их воздушный шар впервые поднял человека в воздух.', question: 'Каким газом они наполняли шар?', answers: ['Гелием', 'Горячим дымом/воздухом', 'Водородом'], correct: 1 },
            { x: 620, y: 420, size: 80, color: '#e91e63', label: 'Лавуазье', title: '🧪 Станция А. Лавуазье', info: 'Лавуазье создал современную химию, доказав, что для горения необходим кислород.', question: 'Какую старую ложную теорию горения он опроверг?', answers: ['Теорию флогистона', 'Теорию алхимии', 'Теорию эфира'], correct: 0 }
        ];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function loop() {
            if (ui.style.display !== 'block') {
                if (keys['w'] || keys['arrowup']) player.y -= player.speed;
                if (keys['s'] || keys['arrowdown']) player.y += player.speed;
                if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
                if (keys['d'] || keys['arrowright']) player.x += player.speed;

                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
                if (player.y < 0) player.y = 0;
                if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;

                places.forEach(p => {
                    if (player.x < p.x + p.size && player.x + player.size > p.x && player.y < p.y + p.size && player.y + player.size > p.y) {
                        openQuest(p);
                    }
                });
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Брусчатка площади
            ctx.strokeStyle = '#cdbca6';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=50) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

            // Здания-станции
            places.forEach(p => {
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.strokeStyle = '#2b1a0e'; ctx.lineWidth = 3; ctx.strokeRect(p.x, p.y, p.size, p.size);
                ctx.fillStyle = '#2b1a0e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(p.label, p.x + 5, p.y - 10);
            });

            // Персонаж
            ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = '#01579b'; ctx.strokeRect(player.x, player.y, player.size, player.size);

            requestAnimationFrame(loop);
        }

        function openQuest(p) {
            for (let k in keys) keys[k] = false; // сброс зажатых клавиш
            document.getElementById('q-title').innerText = p.title;
            document.getElementById('q-text').innerText = p.info;
            document.getElementById('q-question').innerText = p.question;
            const ansDiv = document.getElementById('q-answers');
            ansDiv.innerHTML = '';
            p.answers.forEach((a, i) => {
                const b = document.createElement('button'); b.className = 'ans-btn'; b.innerText = a;
                b.onclick = () => { if (i === p.correct) { alert('🎉 Верно!'); closeQuest(); } else { alert('❌ Попробуй еще раз!'); } };
                ansDiv.appendChild(b);
            });
            ui.style.display = 'block';
        }

        function closeQuest() { ui.style.display = 'none'; player.x = 400; player.y = 300; }

        // Запуск игры по нажатию на стартовую кнопку
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            loop();
        }
    </script>
</body>
</html>
