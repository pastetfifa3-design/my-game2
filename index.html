<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Европа XVIII века: 4 Научные Станции 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0c0805; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; }
        
        #game-view-wrapper { position: relative; width: 800px; height: 600px; box-shadow: 0 0 70px rgba(0,0,0,0.95); border: 4px solid #5c3a21; border-radius: 8px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background-color: #111625; }
        
        /* Свиток появляется ТОЛЬКО у станций */
        #ui-parchment { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 520px; background: #f7f1da; color: #26170c; padding: 25px; border-radius: 6px; border: 12px double #4a321a; box-shadow: 0 25px 70px rgba(0,0,0,0.9); text-align: center; display: none; z-index: 500; background-image: radial-gradient(circle, #faf6eb 60%, #e6d4aa 100%); }
        .scroll-title { font-size: 20px; font-weight: bold; color: #4a2f13; margin-bottom: 12px; border-bottom: 3px double #8d6e63; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .scroll-text { font-size: 14px; line-height: 1.6; text-align: justify; margin-bottom: 15px; color: #3e2723; }
        
        .station-badge { display: inline-block; background: #4a321a; color: #f7f1da; padding: 4px 10px; font-size: 11px; border-radius: 4px; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .close-btn { background: #5c3a21; color: white; border: 1px solid #3e2723; padding: 8px 20px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .close-btn:hover { background: #442a16; }
        
        #controls-hint { position: absolute; bottom: 15px; left: 15px; color: #fffcf5; font-size: 12px; background: rgba(0,0,0,0.8); padding: 8px 14px; border-radius: 4px; pointer-events: none; border: 1px solid #5c3a21; line-height: 1.4; }
    </style>
</head>
<body>

<div id="game-view-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Информационный пергамент научных открытий -->
    <div id="ui-parchment">
        <div class="station-badge" id="station-label">Научная станция</div>
        <div class="scroll-title" id="station-title">Название открытия</div>
        <p class="scroll-text" id="station-text">Описание...</p>
        <button class="close-btn" onclick="closeStationUI()">Отойдите, чтобы закрыть</button>
    </div>

    <div id="controls-hint">
        <strong>Управление исследователя:</strong><br>
        • Ходьба: клавиши <b>W / S</b> (или Стрелки Вверх / Вниз)<br>
        • Поворот камеры: клавиши <b>A / D</b> (или Стрелки Влево / Вправо)
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const MAP_WIDTH = 12;
    const MAP_HEIGHT = 12;
    
    // Игрок начинает в центре пустой площади
    let playerX = 6.5;
    let playerY = 6.5;
    let playerAngle = 0.0; 
    
    const FOV = Math.PI / 3; 
    const HALF_FOV = FOV / 2;
    const NUM_RAYS = 400; 
    const STEP_ANGLE = FOV / NUM_RAYS;
    const MAX_DEPTH = 16.0;

    // Сетка карты
    const gameMap = [];

    // Клавиши управления (добавили Forward и Backward для ходьбы)
    const keys = { Left: false, Right: false, Forward: false, Backward: false };
    let activeStation = null;

    // Буферы текстур (1 - дом, 2 - башня, 3,4,5,6 - научные павильоны)
    const TEX_SIZE = 64;
    const textures = {
        1: new Array(TEX_SIZE * TEX_SIZE),
        2: new Array(TEX_SIZE * TEX_SIZE),
        3: new Array(TEX_SIZE * TEX_SIZE), // Павильон 1
        4: new Array(TEX_SIZE * TEX_SIZE), // Павильон 2
        5: new Array(TEX_SIZE * TEX_SIZE), // Павильон 3
        6: new Array(TEX_SIZE * TEX_SIZE)  // Павильон 4
    };

    function createProceduralTextures() {
        for (let y = 0; y < TEX_SIZE; y++) {
            for (let x = 0; x < TEX_SIZE; x++) {
                let idx = y * TEX_SIZE + x;

                // 1. Обычный кирпичный дом
                if (y % 4 === 0 || (x % 8 === 0 && Math.floor(y / 4) % 2 === 0)) {
                    textures[1][idx] = '#5c271d';
                } else if (y >= 28 && y <= 31) {
                    textures[1][idx] = '#eadeca';
                } else {
                    textures[1][idx] = '#9c4431';
                }

                // 2. Старая каменная башня
                textures[2][idx] = (y % 16 === 0 || x % 16 === 0) ? '#3a3835' : '#737068';

                // 3-6. Научные павильоны (яркие цвета со светящимися неоновыми узорами приборов)
                let isFrame = (x < 4 || x > 60 || y < 4 || y > 60 || y % 20 === 0 || x % 20 === 0);
                textures[3][idx] = isFrame ? '#1a4c6d' : '#29b6f6'; // Паровая машина (Синий)
                textures[4][idx] = isFrame ? '#43a047' : '#81c784'; // Кислород (Зелёный)
                textures[5][idx] = isFrame ? '#e65100' : '#ffb74d'; // Громоотвод (Оранжевый)
                textures[6][idx] = isFrame ? '#4a148c' : '#ba68c8'; // Вакцина (Фиолетовый)
            }
        }
    }
    createProceduralTextures();
    // --- БАЗА ЗНАНИЙ И КООРДИНАТЫ НАУЧНЫХ СТАНЦИЙ ---
    const stationsInfo = {
        3: {
            label: "Станция 1 • Промышленность",
            title: "Паровая машина Джеймса Уатта (1776 г.)",
            text: "В XVIII веке ручной труд сменился машинным. Модернизация парового двигателя Уаттом позволила использовать его на ткацких фабриках, рудниках и заводах. Это изобретение стало сердцем Промышленной революции, превратив Англию, а затем и всю Европу в мировую индустриальную державу."
        },
        4: {
            label: "Станция 2 • Химия",
            title: "Открытие кислорода и падение Флогистона (1774 г.)",
            text: "Джозеф Пристли и Антуан Лавуазье выделили чистый кислород и доказали его роль в горении и дыхании. До этого ученые ошибочно верили в существование «флогистона» — неуловимой материи огня. Открытие заложило основы современной научной химии и весового анализа элементов."
        },
        5: {
            label: "Станция 3 • Физика",
            title: "Укрощение молнии Бенджамином Франклином (1752 г.)",
            text: "Проведя знаменитый опыт с воздушным змеем в грозу, Франклин доказал электрическую природу молний. Он разработал теорию положительного и отрицательного зарядов и изобрел громоотвод. Это спасло тысячи европейских городов от катастрофических пожаров, превратив стихию в объект физики."
        },
        6: {
            label: "Станция 4 • Медицина",
            title: "Первая в мире вакцина Эдварда Дженнера (1796 г.)",
            text: "Натуральная оспа веками выкашивала целые поколения Европы. Английский врач Эдвард Дженнер заметил, что доярки, переболевшие безопасной коровьей оспой, не заражаются человеческой. Он создал первую в истории вакцину, заложив фундамент под спасительную науку иммунологию."
        }
    };

    // --- РУЧНАЯ СБОРКА КАРТЫ С УЧЕТОМ КООРДИНАТ СТАНЦИЙ ---
    for (let i = 0; i < 12; i++) {
        gameMap[i] = new Array(12).fill(0);
    }
    // Внешние стены-дома
    for (let i = 0; i < 12; i++) {
        gameMap[0][i] = 1;
        gameMap[11][i] = 1;
        gameMap[i][0] = 1;
        gameMap[i][11] = 1;
    }
    // Угловые оборонительные башни города
    gameMap[0][0] = 2; gameMap[0][11] = 2;
    gameMap[11][0] = 2; gameMap[11][11] = 2;

    // Расставляем 4 научные станции в центре площади
    gameMap[4][4] = 3; // Паровая машина (Синяя)
    gameMap[4][7] = 4; // Кислород (Зелёная)
    gameMap[7][4] = 5; // Громоотвод (Оранжевая)
    gameMap[7][7] = 6; // Вакцина (Фиолетовая)

    // --- ДВИЖОК ТЕКСТУРИРОВАНИЯ И РАСЧЁТА ЛУЧЕЙ ---
    function render3D() {
        let skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
        skyGrad.addColorStop(0, '#090b14');
        skyGrad.addColorStop(0.7, '#1b2236');
        skyGrad.addColorStop(1, '#3b2a3a');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, 800, 300);

        let floorGrad = ctx.createLinearGradient(0, 300, 0, 600);
        floorGrad.addColorStop(0, '#121110');
        floorGrad.addColorStop(1, '#050504');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, 300, 800, 300);

        ctx.fillStyle = 'rgba(25, 20, 15, 0.4)';
        for (let y = 310; y < 600; y += 15) {
            ctx.fillRect(0, y, 800, 1);
        }

        let startAngle = playerAngle - HALF_FOV;

        for (let i = 0; i < NUM_RAYS; i++) {
            let rayAngle = startAngle + i * STEP_ANGLE;
            let sin = Math.sin(rayAngle);
            let cos = Math.cos(rayAngle);

            let distanceToWall = 0;
            let hitWall = false;
            let wallType = 0;
            let textureX = 0;

            while (!hitWall && distanceToWall < MAX_DEPTH) {
                distanceToWall += 0.015;
                let checkX = Math.floor(playerX + cos * distanceToWall);
                let checkY = Math.floor(playerY + sin * distanceToWall);

                if (checkX < 0 || checkX >= MAP_WIDTH || checkY < 0 || checkY >= MAP_HEIGHT) {
                    hitWall = true;
                    distanceToWall = MAX_DEPTH;
                } else {
                    let tile = gameMap[checkY][checkX];
                    if (tile > 0) {
                        hitWall = true;
                        wallType = tile;
                        let hitX = playerX + cos * distanceToWall;
                        let hitY = playerY + sin * distanceToWall;
                        let blockX = hitX - Math.floor(hitX);
                        let blockY = hitY - Math.floor(hitY);
                        
                        if (Math.abs(blockY) < 0.02 || Math.abs(blockY - 1) < 0.02) {
                            textureX = Math.floor(blockX * TEX_SIZE);
                        } else {
                            textureX = Math.floor(blockY * TEX_SIZE);
                        }
                        textureX = Math.max(0, Math.min(TEX_SIZE - 1, textureX));
                    }
                }
            }

            let correctedDistance = distanceToWall * Math.cos(rayAngle - playerAngle);
            let wallHeight = Math.min(600, Math.floor(400 / correctedDistance));
            let screenX = i * 2; 
            let wallTop = Math.floor((600 - wallHeight) / 2);
            let wallBottom = wallTop + wallHeight;

            if (distanceToWall < MAX_DEPTH) {
                let shade = Math.max(0.15, 1 - (distanceToWall / MAX_DEPTH));
                const texArray = textures[wallType];
                
                for (let screenY = wallTop; screenY < wallBottom; screenY++) {
                    let textureY = Math.floor(((screenY - wallTop) / wallHeight) * TEX_SIZE);
                    textureY = Math.max(0, Math.min(TEX_SIZE - 1, textureY));
                    ctx.fillStyle = texArray[textureY * TEX_SIZE + textureX];
                    ctx.fillRect(screenX, screenY, 2, 1);
                }

                let roofHeight = wallHeight * 0.35;
                ctx.fillStyle = `rgb(${110 * shade}, ${35 * shade}, ${25 * shade})`;
                ctx.beginPath();
                ctx.moveTo(screenX, wallTop);
                ctx.lineTo(screenX + 2, wallTop);
                ctx.lineTo(screenX + 1, wallTop - roofHeight);
                ctx.fill();

                if (distanceToWall > 1.2) {
                    let shadowAlpha = Math.min(0.85, (distanceToWall / MAX_DEPTH));
                    ctx.fillStyle = `rgba(10, 13, 26, ${shadowAlpha})`;
                    ctx.fillRect(screenX, wallTop, 2, wallHeight);
                }
            }
        }
    }
    // --- ОБРАБОТКА ИНТЕРФЕЙСА СТАНЦИЙ ПРИ ПРИБЛИЖЕНИИ ---
    function checkStationProximity() {
        let currentBlockX = Math.floor(playerX);
        let currentBlockY = Math.floor(playerY);
        let foundStation = null;

        // Сканируем соседние клетки вокруг игрока
        const checkOffsets = [
            {x: 0, y: 1}, {x: 0, y: -1}, {x: 1, y: 0}, {x: -1, y: 0},
            {x: 1, y: 1}, {x: -1, y: -1}, {x: 1, y: -1}, {x: -1, y: 1}
        ];

        for (let offset of checkOffsets) {
            let targetX = currentBlockX + offset.x;
            let targetY = currentBlockY + offset.y;
            
            if (targetX >= 0 && targetX < MAP_WIDTH && targetY >= 0 && targetY < MAP_HEIGHT) {
                let tile = gameMap[targetY][targetX];
                if (tile >= 3 && tile <= 6) { // Если рядом одна из 4-х научных станций
                    foundStation = tile;
                    break;
                }
            }
        }

        // Если нашли станцию рядом — выводим свиток с научным фактом
        if (foundStation && activeStation !== foundStation) {
            activeStation = foundStation;
            const info = stationsInfo[foundStation];
            document.getElementById('station-label').innerText = info.label;
            document.getElementById('station-title').innerText = info.title;
            document.getElementById('station-text').innerText = info.text;
            document.getElementById('ui-parchment').style.display = 'block';
        } else if (!foundStation && activeStation !== null) {
            // Если игрок отошел от станции, автоматически закрываем окно
            closeStationUI();
        }
    }

    function closeStationUI() {
        document.getElementById('ui-parchment').style.display = 'none';
        activeStation = null;
    }

    // --- ОБРАБОТКА ДВИЖЕНИЯ И КОЛЛИЗИЙ (КЛАВИАТУРА) ---
    window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.Left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.Right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.Forward = true;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.Backward = true;
    });

    window.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.Left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.Right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.Forward = false;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.Backward = false;
    });

    // Расчет перемещения и скольжения вдоль стен (коллизии)
    function movePlayer() {
        let moveSpeed = 0.04;
        let rotateSpeed = 0.035;

        // Поворот камеры
        if (keys.Left) {
            playerAngle -= rotateSpeed;
            if (playerAngle < 0) playerAngle += Math.PI * 2;
        }
        if (keys.Right) {
            playerAngle += rotateSpeed;
            if (playerAngle > Math.PI * 2) playerAngle -= Math.PI * 2;
        }

        // Ходьба вперёд / назад с проверкой плотных объектов на карте
        let newX = playerX;
        let newY = playerY;

        if (keys.Forward) {
            newX += Math.cos(playerAngle) * moveSpeed;
            newY += Math.sin(playerAngle) * moveSpeed;
        }
        if (keys.Backward) {
            newX -= Math.cos(playerAngle) * moveSpeed;
            newY -= Math.sin(playerAngle) * moveSpeed;
        }

        // Простая и надежная проверка коллизий: если клетка пустая (0) — разрешаем шаг
        if (gameMap[Math.floor(playerY)][Math.floor(newX)] === 0) {
            playerX = newX;
        }
        if (gameMap[Math.floor(newY)][Math.floor(playerX)] === 0) {
            playerY = newY;
        }
    }

    // --- ИГРОВОЙ ЦИКЛ ОБНОВЛЕНИЯ ЭКРАНА ---
    function updateGame() {
        movePlayer();             // Передвигаем персонажа
        checkStationProximity();   // Проверяем, не стоим ли мы у научной станции
        render3D();               // Отрисовываем 3D окружение
        requestAnimationFrame(updateGame);
    }

    updateGame();
</script>
</body>
</html>
